name: CI

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync
      - run: uv run ruff check .
      - run: uv run ruff format --check .

  test:
    name: test (${{ matrix.python-version }}${{ matrix.experimental && '-dev' || '' }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # "t" suffix = free-threaded build; tests/test_free_threading.py fails if the GIL gets re-enabled
        python-version: ["3.13", "3.14", "3.14t", "3.15", "3.15t"]
        include:
          - python-version: "3.16"
            experimental: true
          - python-version: "3.16t"
            experimental: true
    continue-on-error: ${{ matrix.experimental || false }}
    steps:
      - uses: actions/checkout@v4
      # Pre-release Pythons have no Pillow wheels yet, so Pillow builds from source
      - if: matrix.experimental
        run: sudo apt-get update && sudo apt-get install -y libjpeg-dev zlib1g-dev
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv sync
      - run: uv run pytest -m "not integration"
